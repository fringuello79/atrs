<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:linear-gradient(180deg,#8FD0EA 0%,#B7E0EE 38%,#Cfe7d6 52%,#79B36A 66%,#4E8C46 100%)}
  #c{position:fixed;inset:0;display:block}
  #load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#e8dcc8;background:rgba(20,10,4,0.92);z-index:10;transition:opacity .6s}
  #load .bar{width:280px;height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
  #load .bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#2BD66A,#4CD7D0);transition:width .2s}
  #load .t{font-size:13px;letter-spacing:1px;opacity:.85}
  #chip{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(10,20,48,.92);color:#fff;border:1px solid rgba(255,255,255,.18);padding:10px 18px;border-radius:12px;font-size:14px;font-weight:700;letter-spacing:.3px;display:none;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  #home{position:fixed;top:14px;left:16px;z-index:7;display:inline-flex;align-items:center;gap:7px;
    text-decoration:none;font-family:'Figtree',system-ui,sans-serif;font-size:13.5px;font-weight:800;letter-spacing:.3px;
    color:#06253F;background:linear-gradient(90deg,#4CD7D0,#2BD66A);padding:10px 16px;border-radius:12px;
    box-shadow:0 5px 14px rgba(0,0,0,.4);transition:transform .12s}
  #home:hover{transform:translateY(-1px)} #home:active{transform:scale(.97)}
  #logo{position:fixed;top:12px;right:14px;width:74px;height:auto;z-index:8;padding:7px 9px;border-radius:13px;background:rgba(10,20,48,0.42);box-shadow:0 4px 14px rgba(0,0,0,.4);filter:drop-shadow(0 1px 3px rgba(0,0,0,.4))}
  #hint{position:fixed;top:12px;left:50%;transform:translateX(-50%);color:rgba(232,220,200,.35);font-size:10.5px;letter-spacing:.4px;z-index:5;transition:opacity 1.2s;pointer-events:none}
  #err{position:fixed;inset:auto 16px 16px 16px;background:#5a1a1a;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:20;font-size:13px}
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ================== CONFIG ==================
const DEM_Z = 9;
const TEX_Z = 12;
const EX    = 1.4;    // esagerazione verticale
const SLAB  = 2.0;    // spessore mattonella (km visivi)
const ROUTE_W  = 0.10; // larghezza muretto percorso (km)
const ROUTE_H  = 0.25; // altezza del muretto sopra il terreno (km visivi)
const FADE_NEAR = 48, FADE_FAR = 105; // dissolvenza colonne/etichette (km dalla camera)
const BORDER_W = 1.05; // larghezza fascia blu confine (km)
const BEAM_H   = 15;   // altezza colonna di luce (km)
const DEM_URL = (z,x,y)=>`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${x}/${y}.png`;
const TEX_URL = (z,x,y)=>`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`;
const FONT_URL = 'https://www.abruzzotrailrun.it/assets/figtree.woff2';
const EVENT_OF = id => id.startsWith('alba') ? "L'ALBA DEI MARSI"
                    : id.startsWith('xterra') ? 'XTERRA ABRUZZO TRAIL RUN'
                    : id.startsWith('maglio') ? 'SKYRACE DEL MAGLIO'
                    : id.startsWith('voltigno') ? 'SKYRACE DEL VOLTIGNO'
                    : id.startsWith('mammut') ? 'SKYRACE DEL MAMMUT'
                    : id.startsWith('gransasso') ? 'GRAN SASSO TRAIL' : id.toUpperCase();

// ================== util mercator ==================
const R=6378137, TS=256;
const lon2x=(lon,z)=> (lon+180)/360 * TS*Math.pow(2,z);
const lat2y=(lat,z)=> (1 - Math.asinh(Math.tan(lat*Math.PI/180))/Math.PI)/2 * TS*Math.pow(2,z);
const COSLAT = Math.cos(42.3*Math.PI/180);
const mppDEM = 2*Math.PI*R/(TS*Math.pow(2,DEM_Z));
const KM = mppDEM*COSLAT/1000;

let lo0=999,lo1=-999,la0=999,la1=-999;
for(const [la,lo] of ABRUZZO){ lo0=Math.min(lo0,lo); lo1=Math.max(lo1,lo); la0=Math.min(la0,la); la1=Math.max(la1,la); }
const PADD=0.02;
const px0=Math.floor(lon2x(lo0-PADD,DEM_Z)), px1=Math.ceil(lon2x(lo1+PADD,DEM_Z));
const py0=Math.floor(lat2y(la1+PADD,DEM_Z)), py1=Math.ceil(lat2y(la0-PADD,DEM_Z));
const GW=px1-px0, GH=py1-py0;
const cxp=(px0+px1)/2, cyp=(py0+py1)/2;
const W2 = (px)=> (px-cxp)*KM;
const W2y= (py)=> -(py-cyp)*KM;

// ================== caricamento ==================
const loadEl=document.getElementById('load'), pb=document.getElementById('pb'), pt=document.getElementById('pt');
const errEl=document.getElementById('err');
function fail(msg){ errEl.textContent=msg; errEl.style.display='block'; loadEl.style.display='none'; }
let done=0,total=0;
function tick(){ done++; const p=Math.round(100*done/Math.max(total,1)); pb.style.width=p+'%'; pt.textContent=p+'%'; }
function img(url){ return new Promise((res,rej)=>{ const im=new Image(); im.crossOrigin='anonymous';
  im.onload=()=>{tick();res(im)}; im.onerror=()=>rej(new Error(url)); im.src=url; }); }

async function loadFont(){
  try{
    const f=new FontFace('Figtree',`url(${FONT_URL})`,{weight:'100 900'});
    await Promise.race([f.load(), new Promise((_,rj)=>setTimeout(rj,4000))]);
    document.fonts.add(f);
  }catch(e){ /* fallback: sans-serif */ }
}

async function loadAll(){
  const tx0=Math.floor(px0/TS), tx1=Math.floor((px1-1)/TS);
  const ty0=Math.floor(py0/TS), ty1=Math.floor((py1-1)/TS);
  const F=Math.pow(2,TEX_Z-DEM_Z);
  const sx0=Math.floor(px0*F/TS), sx1=Math.floor((px1*F-1)/TS);
  const sy0=Math.floor(py0*F/TS), sy1=Math.floor((py1*F-1)/TS);
  total=(tx1-tx0+1)*(ty1-ty0+1)+(sx1-sx0+1)*(sy1-sy0+1);
  const dc=document.createElement('canvas'); dc.width=GW; dc.height=GH;
  const dctx=dc.getContext('2d',{willReadFrequently:true});
  const demJobs=[];
  for(let tx=tx0;tx<=tx1;tx++)for(let ty=ty0;ty<=ty1;ty++)
    demJobs.push(img(DEM_URL(DEM_Z,tx,ty)).then(im=>dctx.drawImage(im,tx*TS-px0,ty*TS-py0)));
  const texW=GW*F, texH=GH*F;
  const tc=document.createElement('canvas'); tc.width=texW; tc.height=texH;
  const tctx=tc.getContext('2d');
  const texJobs=[];
  for(let tx=sx0;tx<=sx1;tx++)for(let ty=sy0;ty<=sy1;ty++)
    texJobs.push(img(TEX_URL(TEX_Z,tx,ty)).then(im=>tctx.drawImage(im,tx*TS-px0*F,ty*TS-py0*F)));
  await Promise.all([...demJobs,...texJobs,loadFont()]);
  const id=dctx.getImageData(0,0,GW,GH).data;
  const Hgt=new Float32Array(GW*GH);
  for(let i=0;i<GW*GH;i++){ Hgt[i]=(id[i*4]*256+id[i*4+1]+id[i*4+2]/256)-32768; }
  return {Hgt, tex:tc};
}

function buildMask(){
  const poly=ABRUZZO.map(([la,lo])=>[lon2x(lo,DEM_Z)-px0, lat2y(la,DEM_Z)-py0]);
  const m=new Uint8Array(GW*GH);
  for(let y=0;y<GH;y++){
    const yy=y+0.5, xs=[];
    for(let i=0;i<poly.length;i++){
      const [x1,y1]=poly[i], [x2,y2]=poly[(i+1)%poly.length];
      if((y1<=yy&&y2>yy)||(y2<=yy&&y1>yy)) xs.push(x1+(yy-y1)/(y2-y1)*(x2-x1));
    }
    xs.sort((a,b)=>a-b);
    for(let k=0;k+1<xs.length;k+=2){
      const a=Math.max(0,Math.ceil(xs[k]-0.5)), b=Math.min(GW-1,Math.floor(xs[k+1]-0.5));
      for(let x=a;x<=b;x++) m[y*GW+x]=1;
    }
  }
  return m;
}
function bilinF(Hgt){ return (x,y)=>{
  const x0=Math.max(0,Math.min(GW-2,Math.floor(x))), y0=Math.max(0,Math.min(GH-2,Math.floor(y)));
  const fx=x-x0, fy=y-y0;
  return Hgt[y0*GW+x0]*(1-fx)*(1-fy)+Hgt[y0*GW+x0+1]*fx*(1-fy)
        +Hgt[(y0+1)*GW+x0]*(1-fx)*fy+Hgt[(y0+1)*GW+x0+1]*fx*fy; }; }


// ---- muretto estruso lungo il percorso (stile stampa 3D): stretto, in rilievo ----
function chaikin(P){
  const out=[P[0]];
  for(let i=0;i<P.length-1;i++){
    const a=P[i], b=P[i+1];
    out.push([a[0]*0.75+b[0]*0.25, a[1]*0.75+b[1]*0.25]);
    out.push([a[0]*0.25+b[0]*0.75, a[1]*0.25+b[1]*0.75]);
  }
  out.push(P[P.length-1]); return out;
}
function resample(P, step){
  const out=[P[0]];
  for(let i=1;i<P.length;i++){
    let a=out[out.length-1], b=P[i];
    let d=Math.hypot((b[0]-a[0]),(b[1]-a[1]))*KM;
    while(d>=step){
      const t=step/d;
      a=[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
      out.push(a);
      d=Math.hypot((b[0]-a[0]),(b[1]-a[1]))*KM;
    }
  }
  out.push(P[P.length-1]); return out;
}
function routeWall(ptsPx, width, height, zOf){
  let P=ptsPx.filter((p,i)=> i==0 || Math.hypot(p[0]-ptsPx[i-1][0],p[1]-ptsPx[i-1][1])*KM>0.004);
  if(P.length<2) return null;
  P=chaikin(P);                 // toglie il tremolio GPS, curve continue
  P=resample(P, 0.028);         // passo uniforme ~28 m
  const n=P.length;
  let zs=P.map(p=>zOf(p[0],p[1]));
  const zsm=zs.slice();
  for(let i=0;i<n;i++){ let s2=0,c=0; for(let k=-3;k<=3;k++){ const j=i+k; if(j>=0&&j<n){s2+=zs[j];c++;} } zsm[i]=s2/c; }
  zs = zsm.map((z,i)=>Math.max(z, zs[i]-0.05));
  const hw=width/2/KM;
  const dir=i=>{ const a=P[Math.max(i,0)], b=P[Math.min(i+1,n-1)];
    const dx=b[0]-a[0], dy=b[1]-a[1]; const L=Math.hypot(dx,dy)||1; return [dx/L,dy/L]; };
  const Lo=[],Ro=[];
  for(let i=0;i<n;i++){
    const d0=dir(i-1), d1=dir(i);
    let dx=d0[0]+d1[0], dy=d0[1]+d1[1];
    const dl=Math.hypot(dx,dy)||1; dx/=dl; dy/=dl;
    const cosH=Math.max(Math.abs(d0[0]*dx+d0[1]*dy),0.5);
    const sc=Math.min(1/cosH,1.8);
    Lo.push([P[i][0]-dy*hw*sc, P[i][1]+dx*hw*sc]);
    Ro.push([P[i][0]+dy*hw*sc, P[i][1]-dx*hw*sc]);
  }
  const pos=new Float32Array(n*4*3);
  for(let i=0;i<n;i++){
    const zb=zs[i]-0.22, zt=zs[i]+height;
    const set=(k,pxy,z)=>{ pos[(i*4+k)*3]=W2(px0+pxy[0]); pos[(i*4+k)*3+1]=W2y(py0+pxy[1]); pos[(i*4+k)*3+2]=z; };
    set(0,Lo[i],zb); set(1,Ro[i],zb); set(2,Lo[i],zt); set(3,Ro[i],zt);
  }
  const idx=[];
  for(let i=0;i<n-1;i++){
    const a=i*4, b=(i+1)*4;
    idx.push(a+0,b+0,a+2,  b+0,b+2,a+2);
    idx.push(a+1,a+3,b+1,  b+1,a+3,b+3);
    idx.push(a+2,b+2,a+3,  b+2,b+3,a+3);
  }
  idx.push(0,1,2, 1,3,2);
  const e=(n-1)*4; idx.push(e+0,e+2,e+1, e+1,e+2,e+3);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}

// ---- nastro piatto con giunti a spigolo (miter), drappeggiato sul terreno ----
// pts: array di [pxX, pxY] in pixel DEM; width in km; closed: anello chiuso
function ribbon(ptsPx, width, zOf, closed=false){
  // rimuovo punti coincidenti
  const P=[];
  for(const p of ptsPx){
    if(!P.length || Math.hypot(p[0]-P[P.length-1][0], p[1]-P[P.length-1][1])*KM>0.004) P.push(p);
  }
  if(closed && Math.hypot(P[0][0]-P[P.length-1][0],P[0][1]-P[P.length-1][1])*KM<0.004) P.pop();
  const n=P.length; if(n<2) return null;
  const hw=width/2/KM; // mezza larghezza in pixel DEM
  const dir=i=>{ const a=P[i], b=P[(i+1)%n]; const dx=b[0]-a[0], dy=b[1]-a[1]; const L=Math.hypot(dx,dy)||1; return [dx/L,dy/L]; };
  const L=[], Rr=[];
  for(let i=0;i<n;i++){
    let d;
    if(closed){ const d0=dir((i-1+n)%n), d1=dir(i); d=[d0[0]+d1[0], d0[1]+d1[1]]; }
    else if(i===0) d=dir(0);
    else if(i===n-1) d=dir(n-2);
    else { const d0=dir(i-1), d1=dir(i); d=[d0[0]+d1[0], d0[1]+d1[1]]; }
    let dl=Math.hypot(d[0],d[1])||1; d=[d[0]/dl, d[1]/dl];
    // normale (perpendicolare in piano) + limite miter per gli spigoli stretti
    let nx=-d[1], ny=d[0];
    let scale=1;
    if(i>0||closed){ const dprev = closed? dir((i-1+n)%n) : dir(Math.max(i-1,0));
      const cosH = dprev[0]*d[0]+dprev[1]*d[1];
      scale = Math.min(1/Math.max(Math.abs(cosH),0.4), 2.2); }
    L.push([P[i][0]+nx*hw*scale, P[i][1]+ny*hw*scale]);
    Rr.push([P[i][0]-nx*hw*scale, P[i][1]-ny*hw*scale]);
  }
  const m=closed?n+1:n;
  const pos=new Float32Array(m*2*3);
  for(let i=0;i<m;i++){
    const k=i%n;
    const zl=zOf(L[k][0],L[k][1]), zr=zOf(Rr[k][0],Rr[k][1]);
    pos[i*6+0]=W2(px0+L[k][0]); pos[i*6+1]=W2y(py0+L[k][1]); pos[i*6+2]=zl;
    pos[i*6+3]=W2(px0+Rr[k][0]); pos[i*6+4]=W2y(py0+Rr[k][1]); pos[i*6+5]=zr;
  }
  const idx=[];
  for(let i=0;i<m-1;i++){ const a=i*2,b=a+1,c=a+2,d2=a+3; idx.push(a,b,c, b,d2,c); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}

async function main(){

  // uniformo il mare/costa: i tile satellitari includono l'Adriatico (bluastro/scuro) a est.
  // sostituisco i pixel "acqua" con un verde-costa coerente col resto del terreno.
  (function fixCoast(){
    const ictx=tex.getContext('2d'); const W=tex.width, Hh=tex.height;
    const im=ictx.getImageData(0,0,W,Hh); const d=im.data;
    // stimo un verde-costa medio dai pixel chiaramente "terra" (verdi)
    let sr=0,sg=0,sb=0,cn=0;
    for(let i=0;i<d.length;i+=4){
      const r=d[i],g=d[i+1],b=d[i+2];
      if(g>70 && g>=b && g>=r-10 && b<150){ sr+=r; sg+=g; sb+=b; cn++; }
    }
    const mr=cn?sr/cn:90, mg=cn?sg/cn:120, mb=cn?sb/cn:80;
    for(let i=0;i<d.length;i+=4){
      const r=d[i],g=d[i+1],b=d[i+2];
      const lum=(r+g+b)/3;
      const isWater = (b>r+10 && b>g-6) || (lum<55 && b>=r);
      if(isWater){
        const j=0.85+ (Math.random()-0.5)*0.10;
        d[i]=Math.min(255,mr*j); d[i+1]=Math.min(255,mg*j); d[i+2]=Math.min(255,mb*j);
      }
    }
    // attenuo le macchie molto scure (urbano tipo Chieti-Pescara) verso il tono medio
    for(let i=0;i<d.length;i+=4){
      const r=d[i],g=d[i+1],b=d[i+2]; const lum=(r+g+b)/3;
      // grigio urbano: bassa saturazione + medio-scuro -> lo riporto al verde medio
      const mx=Math.max(r,g,b), mn=Math.min(r,g,b); const sat=mx-mn;

      } else if(lum<70){
        const t=0.6; d[i]=r*(1-t)+mr*t; d[i+1]=g*(1-t)+mg*t; d[i+2]=b*(1-t)+mb*t;
      } else if(lum<95){

      }

  })();

  // ---- confine: muro blu sugli spigoli ESATTI della mesh del terreno (perimetro fedele, frastagliato) ----

    const dens=ABRUZZO.map(([la,lo])=>[lon2x(lo,DEM_Z)-px0, lat2y(la,DEM_Z)-py0]);

  const glow=sunSprite(220,[[0,'rgba(255,244,214,0.95)'],[0.18,'rgba(255,230,170,0.55)'],[0.5,'rgba(255,210,140,0.16)'],[1,'rgba(255,200,120,0)']]);
  glow.position.copy(sunPos); glow.renderOrder=-2; scene.add(glow);
  const disc=sunSprite(70,[[0,'rgba(255,252,238,1)'],[0.55,'rgba(255,247,225,1)'],[0.75,'rgba(255,235,190,0.6)'],[1,'rgba(255,230,180,0)']]);
  disc.position.copy(sunPos); disc.renderOrder=-1; scene.add(disc);

  // ---- camera ----
  const cam=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,1,4000);
  cam.up.set(0,0,1);
  cam.position.set(0,-168,192);
  const ctr=new OrbitControls(cam,renderer.domElement);
  ctr.target.set(0,6,0); ctr.enableDamping=true; ctr.dampingFactor=0.06;
  ctr.minDistance=25; ctr.maxDistance=420;
  ctr.maxPolarAngle=Math.PI*0.48;
  ctr.update();

  // ---- click sui percorsi ----
  const ray=new THREE.Raycaster();
  const chip=document.getElementById('chip');
  renderer.domElement.addEventListener('pointerdown',ev=>{
    const m=new THREE.Vector2(ev.clientX/innerWidth*2-1,-(ev.clientY/innerHeight)*2+1);
    ray.setFromCamera(m,cam);
    const hits=ray.intersectObjects(routeMeshes,false);
    if(hits.length){ chip.textContent=hits[0].object.userData.name; chip.style.display='block';
      clearTimeout(chip._t); chip._t=setTimeout(()=>chip.style.display='none',4200); }
  });

  addEventListener('resize',()=>{ cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
  loadEl.style.opacity='0'; setTimeout(()=>loadEl.style.display='none',650);
  window.__ready=true;
  setTimeout(()=>{ const hi=document.getElementById('hint'); if(hi) hi.style.opacity='0'; }, 7000);
  (function anim(){
    requestAnimationFrame(anim); ctr.update();
    for(const it of fadeItems){
      const d=cam.position.distanceTo(it.anchor);
      const k=Math.max(0,Math.min(1,(d-FADE_NEAR)/(FADE_FAR-FADE_NEAR)));
      it.beamMat.opacity=k; it.spriteMat.opacity=k;
      const vis=k>0.02; it.objs.forEach(o=>o.visible=vis);
    }
    renderer.render(scene,cam);
  })();
}
main();
</script>
</body>
</html>
